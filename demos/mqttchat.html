<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mqttchat</title>
<style>
  @font-face {
    font-family: "Chat Mono"; font-display: swap;
    src: local("Tomo"),
         url("https://cdn.jsdelivr.net/npm/@fontsource/dejavu-mono@5.3.0/files/dejavu-mono-latin-700-normal.woff2") format("woff2");
  }
  :root {
    --bg: #272822; --text: #f8f8f2; --dim: #555; --line: #333;
    --chrome: #d4d0c8; --chrome-text: #000; --hi: #fff; --lo: #808080; --dark: #000;
    --warn: #ff6b5b; --ok: #5fdc7a; --link: #66d9ef; --discord: #8c9eff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/13px "Chat Mono", "Lucida Console", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; min-height: 0; }

  #log { flex: 1; overflow-x: hidden; overflow-y: scroll; min-width: 0; -webkit-font-smoothing: none; }
  .msg { display: flex; align-items: flex-start; }
  .time { flex: none; padding: 0 5px; color: var(--dim); }
  .tag  { flex: none; padding-right: 5px; color: var(--dim); white-space: nowrap; }
  .nick { flex: none; width: 100px; padding: 0 5px; text-align: right;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { flex: 1; min-width: 0; padding: 0 5px; border-left: 1px solid var(--line);
          white-space: pre-wrap; word-break: break-word; }
  .body a { color: var(--link); text-decoration: underline; }
  .body a:hover { color: var(--hi); }
  .imgs { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 0; }
  .imgs a { display: block; line-height: 0; }
  .imgs img, .imgs video { display: block; max-width: min(100%, 640px); max-height: 480px;
              border: 1px solid var(--line); background: #1e1f1a; }
  .imgs iframe.yt { display: block; width: min(100%, 640px); aspect-ratio: 16 / 9;
                    height: auto; border: 1px solid var(--line); background: #000; }
  .imgs iframe.tweet { display: block; width: min(100%, 550px); height: 360px;
                       border: 0; border-radius: 12px; background: transparent; color-scheme: normal; }
  .imgs iframe.emb { display: block; border: 0; background: transparent; }
  .imgs iframe.wide { width: min(100%, 640px); aspect-ratio: 16 / 9; height: auto;
                      border: 1px solid var(--line); background: #000; }
  .imgs iframe.spotify { width: min(100%, 640px); height: 152px; border-radius: 12px; }
  .imgs iframe.spotify.tall { height: 352px; }
  .imgs iframe.sc { width: min(100%, 640px); height: 166px; }
  .imgs iframe.sc.tall { height: 450px; }
  .imgs iframe.tiktok { width: min(100%, 325px); height: 578px; border-radius: 8px; background: #000; }
  .imgs iframe.insta { width: min(100%, 400px); height: 560px; border-radius: 4px; background: #fff; }
  .imgs iframe.tenor { width: min(100%, 320px); aspect-ratio: 1; height: auto; }
  .imgs iframe.reddit { width: min(100%, 640px); height: 520px; border-radius: 8px; }
  .imgs iframe.bsky { width: min(100%, 550px); height: 360px; }
  .imgs iframe.threads { width: min(100%, 540px); height: 600px; border-radius: 8px; background: #101010; }
  .imgs iframe.apple { width: min(100%, 660px); height: 175px; border-radius: 10px; }
  .imgs iframe.apple.tall { height: 450px; }
  .imgs iframe.deezer { width: min(100%, 640px); height: 152px; border-radius: 10px; }
  .imgs iframe.deezer.tall { height: 352px; }
  .imgs iframe.bandcamp { width: min(100%, 640px); height: 120px; }
  .imgs iframe.bandcamp.tall { width: min(100%, 400px); height: 472px; }
  .imgs iframe.map { width: min(100%, 640px); height: 360px; border: 1px solid var(--line); }
  .imgs iframe.steam { width: min(100%, 646px); height: 190px; }
  .imgs a img { cursor: zoom-in; }
  .imgs iframe.vocaroo { width: min(100%, 300px); height: 60px; }
  .imgs iframe.poll { width: min(100%, 640px); height: 520px; border-radius: 8px; }
  .imgs iframe.telegram { width: min(100%, 520px); height: 360px; }
  .imgs iframe.mastodon { width: min(100%, 520px); height: 360px; border-radius: 8px; }
  .imgs iframe.imgur { width: min(100%, 540px); height: 500px; }
  .imgs iframe.pinterest { width: min(100%, 345px); height: 620px; border-radius: 16px; }
  .imgs iframe.mixcloud { width: min(100%, 640px); height: 120px; }
  .imgs iframe.fbpost { width: min(100%, 500px); height: 600px; background: #fff; border-radius: 8px; }
  .imgs iframe.audiomack { width: min(100%, 640px); height: 252px; }
  .imgs iframe.audiomack.tall { height: 400px; }
  .imgs iframe.codepen { width: min(100%, 640px); height: 400px; }
  .imgs iframe.gdoc { width: min(100%, 640px); height: 520px; background: #fff; border: 1px solid var(--line); }
  .imgs iframe.gsheet { width: min(100%, 640px); height: 420px; background: #fff; border: 1px solid var(--line); }
  .livewrap { display: flex; flex-direction: column; gap: 2px; width: min(100%, 640px); }
  .livewrap iframe.wide { width: 100%; }
  .live { color: var(--dim); }
  .live.on { color: var(--warn); font-weight: bold; }
  .live.off { color: var(--dim); }
  .card { display: flex; gap: 8px; width: min(100%, 520px); padding: 6px; line-height: 1.35;
          background: #1e1f1a; border: 1px solid var(--line); border-left: 3px solid var(--link);
          color: var(--text) !important; text-decoration: none !important; }
  .card:hover { background: #26271f; }
  .card.loading { color: var(--dim) !important; border-left-color: var(--dim); }
  .imgs .card img { flex: none; width: 96px; height: 96px; object-fit: cover; cursor: pointer; }
  .imgs .card.small img { width: 48px; height: 48px; border-radius: 4px; }
  .cinfo { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ctitle { font-weight: bold; color: var(--link); overflow-wrap: anywhere; }
  .ctext { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .cmeta { color: var(--dim); }
  .body strong { font-weight: bold; }
  .body em { font-style: italic; }
  .body code { background: #1e1f1a; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .spoiler { background: #4a4b45; color: transparent; border-radius: 3px; cursor: pointer; padding: 0 2px; }
  .spoiler:not(.shown) * { color: transparent !important; background: transparent !important;
                           border-color: transparent !important; pointer-events: none; }
  .spoiler:not(.shown):hover { background: #5a5b55; }
  .spoiler.shown { background: #3a3b35; color: inherit; cursor: auto; }
  .spoiler:focus-visible { outline: 1px dotted var(--text); }
  #lightbox { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 8px; padding: 16px;
              background: rgba(0, 0, 0, 0.88); cursor: zoom-out; }
  #lightbox[hidden] { display: none; }
  #lbimg { max-width: 100%; max-height: calc(100% - 40px); object-fit: contain; background: #1e1f1a; }
  .lbbar { display: flex; gap: 12px; align-items: center; cursor: auto;
           font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif; color: var(--chrome-text); }
  .lbbar a { color: var(--link); }
  .imgs audio { display: block; width: min(100%, 640px); height: 32px; }
  .legend { display: flex; align-items: center; gap: 8px; padding: 3px 6px;
            border-bottom: 1px solid var(--line); color: var(--dim); }
  .legend .ltext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend label { flex: none; display: flex; align-items: center; gap: 4px; cursor: pointer;
                  color: var(--text); white-space: nowrap; user-select: none; }
  .legend input { margin: 0; cursor: pointer; accent-color: var(--link); }
  .legend.off .ltext { text-decoration: line-through; }
  .slot:empty { display: none; }
  .legend a { color: var(--link); }
  .legend a:hover { color: var(--hi); }
  .msg.note .body { opacity: 0.7; }
  .msg.note.err .body { opacity: 1; color: var(--warn); }
  .msg.note.invite .body { opacity: 1; color: var(--discord); }
  .msg.note.invite .body a { color: var(--discord); font-weight: bold; }
  @media (max-width: 560px) { .tag { display: none; } }

  #users {
    width: 150px; flex: none; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 700px) { #users { display: none; } }
  .uhead { color: var(--dim); padding: 2px 5px; border-bottom: 1px solid var(--line); }
  #ulist { flex: 1; overflow-y: auto; padding: 0 5px; }
  .user { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user:hover { background: #494a44; }
  #discord { display: block; padding: 2px 5px; border-top: 1px solid var(--line);
             color: var(--discord); text-decoration: none; }
  #discord:hover { background: #494a44; text-decoration: underline; }
  #status { padding: 2px 5px; border-top: 1px solid var(--line); color: var(--warn); }
  #status.on { color: var(--ok); }
  #status::before { content: "\25CF  "; }

  .chrome {
    background: var(--chrome); color: var(--chrome-text);
    border-top: 2px solid var(--hi);
    font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif;
  }
  .bar { display: flex; gap: 4px; padding: 4px; }

  input, button { font: inherit; color: inherit; }
  input[type=text], input[type=password] {
    background: #fff; color: #000; padding: 3px 4px; border: 2px solid;
    border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px 0 var(--dark); border-radius: 0; min-width: 0;
  }
  #text { flex: 1; font-family: "Chat Mono", "Lucida Console", Menlo, Consolas, monospace; }
  button {
    background: var(--chrome); padding: 3px 10px; border: 2px solid; border-radius: 0;
    border-color: var(--hi) var(--dark) var(--dark) var(--hi);
    box-shadow: inset -1px -1px 0 var(--lo); cursor: pointer; white-space: nowrap;
  }
  button:active:not(:disabled) {
    border-color: var(--dark) var(--hi) var(--hi) var(--dark);
    box-shadow: inset 1px 1px 0 var(--lo); padding: 4px 9px 2px 11px;
  }
  button:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
  input:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #overlay[hidden] { display: none; }
  .dialog {
    width: 372px; max-width: 100%; background: var(--chrome); color: #000; padding: 2px;
    border: 1px solid; border-color: var(--chrome) #404040 #404040 var(--chrome);
    box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo);
    font: 12px/1.2 Tahoma, "MS Sans Serif", Verdana, Arial, sans-serif;
  }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 2px 2px 5px; color: #fff; font-weight: bold;
    background: #000080;
  }
  .titlebar button { padding: 0; width: 16px; height: 14px; line-height: 10px; font-size: 11px; font-weight: bold; color: #000; }
  .titlebar button:active:not(:disabled) { padding: 1px 0 0 1px; }
  .dbody { padding: 12px 12px 10px; }
  .dbody label { display: block; margin-bottom: 6px; }
  .dbody input { width: 100%; }
  #count { align-self: center; padding: 0 2px; color: var(--lo); font-variant-numeric: tabular-nums; }
  #count.near { color: #a05a00; font-weight: bold; }
  #count.full { color: #c00000; font-weight: bold; }
  .dbuttons { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .dbuttons button { width: 94px; padding: 4px 0; }
  .dbuttons button:active:not(:disabled) { padding: 5px 0 3px 2px; }
  #nickbtn { max-width: 30%; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
</style>
</head>
<body>
<div class="app">

    <span class="ltext" title="Images, videos and audio from imglink.cc are played right here in the chat.">Images, videos, audio or links from <a href="https://imglink.cc" target="_blank" rel="noopener noreferrer">https://imglink.cc</a> will be rendered right here in the chat. Upload yours and paste the link!</span>
    <label title="Turn off to stop loading imglink.cc and Discord images, videos and audio in the chat (YouTube is not affected)"><input type="checkbox" id="mediatoggle" checked> show media</label>
  </div>
  <div class="main">
    <div id="log" aria-live="polite">
    </div>
    <aside id="users">
      <div class="uhead">seen here</div>
      <div id="ulist"></div>
      <a id="discord" href="https://discord.gg/QWUXMggf" target="_blank" rel="noopener noreferrer">&#x2192; join our Discord</a>
      <div id="status">connecting…</div>
    </aside>
  </div>

  <div class="chrome">
    <form class="bar" id="form">
      <button id="nickbtn" type="button" title="Change nickname">anonymous</button>
      <input id="text" type="text" maxlength="500" autocomplete="off" aria-label="Message">

</div>

<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">

    <a id="lbopen" target="_blank" rel="noopener noreferrer nofollow">open original</a>
    <button type="button" id="lbclose">Close</button>

</div>

<div id="overlay" hidden>
  <form class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="titlebar">
      <span id="dtitle">Prompt</span>
      <button type="button" id="dclose" aria-label="Close">&#x2715;</button>
    </div>
    <div class="dbody">
      <label for="dinput">Nickname?</label>
      <input id="dinput" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <div class="dbuttons">
        <button id="dok">OK</button>
        <button type="button" id="dcancel">Cancel</button>
      </div>
    </div>

</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
"use strict";

const TOPIC  = "https://jnvanderz.github.io/";
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const DISCORD = "https://discord.gg/QWUXMggf";

const SALT = "jnvanderz.github.io/mqttchat|identity-v1|";
const MAX_NICK = 24, MAX_TEXT = 500;
const enc = new TextEncoder();
const PKCS8_ED25519_PREFIX = Uint8Array.from(
  [0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20]);

const b64 = bytes => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(
  atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const sha256 = async bytes => new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));

async function publicId(pubB64) {
  return b64((await sha256(enc.encode(SALT + pubB64))).slice(0, 12));
}

async function deriveKeys(identity) {
  const seed = await sha256(enc.encode(SALT + identity));
  const pkcs8 = new Uint8Array(48);
  pkcs8.set(PKCS8_ED25519_PREFIX);
  pkcs8.set(seed, 16);
  const priv = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "Ed25519" }, true, ["sign"]);
  const pub = (await crypto.subtle.exportKey("jwk", priv)).x;
  return { priv, pub, id: await publicId(pub) };
}

const signedBytes = (n, t, m) => enc.encode(JSON.stringify([TOPIC, n, t, m]));

async function signMessage(keys, n, m) {
  const t = Date.now();
  const sig = await crypto.subtle.sign({ name: "Ed25519" }, keys.priv, signedBytes(n, t, m));
  return JSON.stringify({ n, k: keys.pub, t, m, s: b64(new Uint8Array(sig)) });
}

async function verifyMessage(raw) {
  try {
    if (raw.length > 2000) return null;
    const { n, k, t, m, s } = JSON.parse(raw);
    if (typeof n !== "string" || typeof m !== "string" || typeof k !== "string" ||
        typeof s !== "string" || !Number.isSafeInteger(t)) return null;
    if (!n || n.length > MAX_NICK || !m || m.length > MAX_TEXT) return null;
    const key = await crypto.subtle.importKey("raw", unb64(k), { name: "Ed25519" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "Ed25519" }, key, unb64(s), signedBytes(n, t, m));
    return ok ? { n, t, m, s, id: await publicId(k) } : null;
  } catch (e) {
    return null;
  }
}

function randomIdentity() {
  return b64(crypto.getRandomValues(new Uint8Array(24)));
}

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let nickname = "";
let keys = null;
let client = null;
let connected = false;
let welcomed = false;
const seen = new Set();
const users = new Map();

function hue(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
const colorOf = id => `hsl(${hue(id)} 90% 65%)`;
const pad = n => String(n).padStart(2, "0");

const URL_RE = /\b(?:https?:\/\/|www\.)[^\s<>"'`]+/gi;
const TRAILING = /[.,;:!?)\]}>'"*|_~]+$/;

const IMGLINK_HOSTS = new Set(["imglink.cc", "www.imglink.cc"]);
const MAX_MEDIA = 4;
const MEDIA_TYPES = {
  image: /\.(?:png|jpe?g|jfif|gif|webp|svg|avif|bmp|ico|apng)$/i,
  video: /\.(?:mp4|m4v|webm|mov|ogv|mkv)$/i,
  audio: /\.(?:mp3|wav|ogg|oga|opus|m4a|aac|flac|weba)$/i,
};

function imglinkMedia(href) {
  let u;
  try { u = new URL(href); } catch (e) { return null; }
  if (!IMGLINK_HOSTS.has(u.hostname.toLowerCase())) return null;
  const path = u.pathname;
  if (/^\/cdn\/[A-Za-z0-9_\-\/]+\.[A-Za-z0-9]+$/.test(path)) {
    const src = "https://imglink.cc" + path;
    for (const kind in MEDIA_TYPES) {
      if (MEDIA_TYPES[kind].test(path)) return { kind, src, href: src };
    }
    return null;
  }
  const viewer = path.match(/^\/i\/([A-Za-z0-9_-]+)\/?$/);
  if (viewer) {
    return { kind: "image", src: "https://imglink.cc/cdn/medium/" + viewer[1] + ".webp",
             href: "https://imglink.cc/i/" + viewer[1] };
  }
  return null;
}

const YT_HOSTS = new Set(["youtube.com", "www.youtube.com", "m.youtube.com",
  "music.youtube.com", "youtube-nocookie.com", "www.youtube-nocookie.com", "youtu.be"]);
const YT_ID = /^[A-Za-z0-9_-]{11}$/;

function ytSeconds(v) {
  if (!v) return 0;
  if (/^\d+$/.test(v)) return +v;
  const m = v.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}

function youtubeMedia(href) {
  let u;
  try { u = new URL(href); } catch (e) { return null; }
  const host = u.hostname.toLowerCase();
  if (!YT_HOSTS.has(host)) return null;
  let id = null;
  if (host === "youtu.be") {
    id = u.pathname.split("/")[1];
  } else if (u.pathname === "/watch") {
    id = u.searchParams.get("v");
  } else {
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^\/?#]+)/);
    if (m) id = m[1];
  }
  if (!id || !YT_ID.test(id)) return null;
  const start = ytSeconds(u.searchParams.get("t") || u.searchParams.get("start"));
  const src = "https://www.youtube-nocookie.com/embed/" + id + (start ? "?start=" + start : "");
  return { kind: "youtube", src, href };
}

let showMedia = true;

function fillSlot(slot) {
  slot.textContent = "";
  if (showMedia) slot.append(mediaElement(slot._item));
}

function setShowMedia(on) {
  showMedia = on;
  store.set("mqttchat.showMedia", on ? "1" : "0");
  $("mediatoggle").checked = on;
  $("legend").classList.toggle("off", !on);
  for (const slot of document.querySelectorAll("#log .slot")) fillSlot(slot);
  if (on) $("log").scrollTop = $("log").scrollHeight;
}

const DISCORD_HOSTS = new Set(["cdn.discordapp.com", "media.discordapp.net"]);

function discordMedia(href) {
  let u;
  try { u = new URL(href); } catch (e) { return null; }
  if (u.protocol !== "https:" || !DISCORD_HOSTS.has(u.hostname.toLowerCase())) return null;
  if (!/^\/(?:ephemeral-)?attachments\/\d+\/\d+\/[^\/]+$/.test(u.pathname)) return null;
  for (const kind in MEDIA_TYPES) {
    if (!MEDIA_TYPES[kind].test(u.pathname)) continue;
    const src = kind === "image" ? u.href
      : "https://cdn.discordapp.com" + u.pathname + u.search;
    return { kind, src, href: u.href };
  }
  return null;
}

const TWITTER_HOSTS = new Set(["twitter.com", "www.twitter.com", "mobile.twitter.com",
  "x.com", "www.x.com", "mobile.x.com"]);
const tweetFrames = new Map();
let tweetSeq = 0;

function twitterMedia(href) {
  let u;

function parseMessageData(e) {

window.addEventListener("message", e => {
  const origin = e.origin;
  const md = e.data;
  if (md && typeof md === "object" && md.type === "setHeight" && mastodonFrames.has(md.id)) {
    const { f, origin: o } = mastodonFrames.get(md.id);
    if (o === origin && f.contentWindow === e.source) setFrameHeight(f, md.height);
    if (!f.isConnected) mastodonFrames.delete(md.id);
    return;
  }
  if (origin === "https://embed.reddit.com") {
    const d = parseMessageData(e);
    if (d && d.type === "resize.embed") setFrameHeight(frameFromSource("iframe.reddit", e.source), d.data);
  } else if (origin === "https://embed.bsky.app") {
    const d = parseMessageData(e);
    if (d && d.height) {
      const f = document.querySelector('#log iframe.bsky[data-bsky-id="' + CSS.escape(String(d.id)) + '"]')
        || frameFromSource("iframe.bsky", e.source);
      setFrameHeight(f, d.height);
    }
  } else if (origin === "https://t.me") {
    const d = parseMessageData(e);
    if (d && d.event === "resize") setFrameHeight(frameFromSource("iframe.telegram", e.source), d.height);
  } else if (origin === "https://imgur.com") {
    const d = parseMessageData(e);
    if (d && d.message === "resize_imgur") setFrameHeight(frameFromSource("iframe.imgur", e.source), d.height);
  } else if (origin === "https://www.threads.com" || origin === "https://www.threads.net") {
    const d = parseMessageData(e);
    if (d && d.type === "MEASURE" && d.details) setFrameHeight(frameFromSource("iframe.threads", e.source), d.details.height);
  }
});

const EMBEDS = [youtubeMedia, twitterMedia, redditMedia, blueskyMedia, threadsMedia, facebookMedia,

function mediaFor(href) {

function stickOnResize(el) {

function mediaElement(item) {

  if (kind === "frame" || kind === "lazyframe") {
    const f = document.createElement("iframe");
    f.className = "emb " + item.cls;
    f.title = item.title || "Embedded content";
    f.loading = "lazy";
    f.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture; web-share";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    if (kind === "frame") f.src = src;
    else item.resolve().then(url => { if (url) f.src = url; else f.remove(); });
    if (!item.status) return f;
    const wrap = document.createElement("div"); wrap.className = "livewrap";
    const badge = document.createElement("div"); badge.className = "live pending";
    badge.textContent = item.status[1] + " · checking…";
    wrap.append(badge, f);

      if (!st) { badge.remove(); return; }
      badge.className = "live " + (st.live ? "on" : "off");
      badge.textContent = (st.live ? "\u25CF LIVE" : "\u25CB offline") + " · " + item.status[1] +
        (st.live && st.detail ? " · " + st.detail : "");

    return wrap;
  }
  if (kind === "card") return cardElement(item);
  if (kind === "youtube") {
    const f = document.createElement("iframe");
    f.className = "yt";
    f.src = src;
    f.title = "YouTube video";
    f.loading = "lazy";
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    return f;
  }
  if (kind === "image") {
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
    const im = document.createElement("img");
    im.src = src; im.alt = "shared image"; im.loading = "lazy";
    im.referrerPolicy = "no-referrer";
    const fallbacks = (item.fallbacks || []).slice();
    let current = src;
    im.addEventListener("error", () => {
      if (fallbacks.length) { current = fallbacks.shift(); im.src = current; } else a.remove();
    });
    im.addEventListener("load", () => stickOnResize(im));
    a.addEventListener("click", e => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openLightbox(current, href);
    });
    a.append(im);
    return a;
  }
  const m = document.createElement(kind);
  m.controls = true;
  m.preload = "metadata";
  m.src = src;
  if (kind === "video") m.playsInline = true;
  if (item.loop) { m.loop = true; m.muted = true; m.autoplay = true; }
  m.setAttribute("referrerpolicy", "no-referrer");
  m.addEventListener("error", () => m.remove());

}

    parent.append(url);
  }
  if (trail) parent.append(trail[0]);
}

function renderInline(parent, text, media, collect, depth) {
  if (depth > 6) { parent.append(text); return; }
  let last = 0;
  for (const m of text.matchAll(TOKEN_RE)) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[2] !== undefined) {
      const c = document.createElement("code"); c.textContent = m[2]; parent.append(c);
    } else if (m[3] !== undefined) {
      const sp = document.createElement("span"); sp.className = "spoiler";
      sp.title = "Spoiler: click to reveal";
      sp.tabIndex = 0;
      sp.setAttribute("role", "button");
      const reveal = e => {
        if (sp.classList.contains("shown")) return;
        e.preventDefault(); e.stopPropagation();
        sp.classList.add("shown"); sp.removeAttribute("title"); sp.removeAttribute("role"); sp.tabIndex = -1;
      };
      sp.addEventListener("click", reveal, true);
      sp.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") reveal(e); });
      renderInline(sp, m[3], media, false, depth + 1);
      parent.append(sp);
    } else if (m[4] !== undefined) {
      const b = document.createElement("strong");
      renderInline(b, m[4], media, collect, depth + 1);
      parent.append(b);
    } else if (m[5] !== undefined) {
      const it = document.createElement("em");
      renderInline(it, m[5], media, collect, depth + 1);
      parent.append(it);
    } else if (m[6] !== undefined) {
      appendLink(parent, m[6], media, collect);
    }
  }
  if (last < text.length) parent.append(text.slice(last));
}

function cardElement(item) {
  const a = document.createElement("a");
  a.className = "card loading";
  a.href = item.href; a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
  a.textContent = "loading preview…";
  item.load().then(d => {
    if (!d) { a.remove(); return; }
    a.textContent = "";
    a.className = "card" + (d.small ? " small" : "");
    if (d.url && /^https:\/\//.test(d.url)) a.href = d.url;
    if (d.image && /^https:\/\//.test(d.image)) {
      const im = document.createElement("img");
      im.src = d.image; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
      im.addEventListener("error", () => im.remove());
      a.append(im);
    }
    const info = document.createElement("div"); info.className = "cinfo";
    const t = document.createElement("div"); t.className = "ctitle"; t.textContent = d.title;
    info.append(t);
    if (d.text) { const p = document.createElement("div"); p.className = "ctext"; p.textContent = d.text; info.append(p); }
    if (d.meta) { const mt = document.createElement("div"); mt.className = "cmeta"; mt.textContent = d.meta; info.append(mt); }
    a.append(info);
    stickOnResize(a);
  }).catch(() => a.remove());
  return a;
}

function linkify(el, text) {
  el.textContent = "";
  const media = [];
  renderInline(el, text, media, true, 0);
  if (media.length) {
    const box = document.createElement("div"); box.className = "imgs";
    for (const item of media) {
      if (item.kind === "youtube" || item.kind === "tweet" || item.always) { box.append(mediaElement(item)); continue; }
      const slot = document.createElement("span"); slot.className = "slot";
      slot._item = item;
      fillSlot(slot);
      box.append(slot);
    }
    el.append(box);
  }
}

function openLightbox(src, href) {
  const lb = $("lightbox");
  $("lbimg").src = src;
  $("lbopen").href = href;
  lb.hidden = false;
  $("lbclose").focus();
}

function closeLightbox() {
  const lb = $("lightbox");
  if (lb.hidden) return;
  lb.hidden = true;
  $("lbimg").removeAttribute("src");
  $("text").focus();
}

function row(t, idText, nickText, bodyText) {
  const d = new Date(t);
  const r = document.createElement("div"); r.className = "msg";
  const time = document.createElement("span"); time.className = "time";
  time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  time.title = d.toLocaleString();
  const id = document.createElement("span"); id.className = "tag"; id.textContent = idText;
  const nick = document.createElement("span"); nick.className = "nick"; nick.textContent = nickText;
  const body = document.createElement("span"); body.className = "body";
  linkify(body, bodyText);
  r.append(time, id, nick, body);
  return { r, id, nick };
}

function append(r) {
  const log = $("log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.appendChild(r);
  while (log.children.length > 300) log.firstChild.remove();
  forgetTweetFrames();
  if (stick) log.scrollTop = log.scrollHeight;
}

function note(text, kind) {
  const { r } = row(Date.now(), " ".repeat(6), "~", text);
  r.className = "msg note" + (kind ? " " + kind : "");
  append(r);
}

function showMessage(msg) {
  const { r, id, nick } = row(msg.t, msg.id.slice(0, 6), msg.n, msg.m);
  nick.style.color = colorOf(msg.id);
  id.title = nick.title = "Public ID: " + msg.id;
  append(r);

  let u = users.get(msg.id);
  if (!u) {
    u = document.createElement("div"); u.className = "user";
    u.style.color = colorOf(msg.id);
    users.set(msg.id, u);
    $("ulist").appendChild(u);
  }
  u.textContent = msg.n;
  u.title = msg.id;
}

function refreshSend() {
  $("sendbtn").disabled = !(connected && keys);
}
function refreshNick() {
  $("nickbtn").textContent = nickname || "anonymous";
}

async function loadIdentity() {
  let identity = store.get("mqttchat.identity");
  if (!identity) {
    identity = randomIdentity();
    store.set("mqttchat.identity", identity);
  }
  keys = await deriveKeys(identity);
  $("nickbtn").title = "Change nickname (your ID: " + keys.id + ")";
  refreshSend();
}

let queue = Promise.resolve();
function onMessage(topic, payload, packet) {
  if (topic !== TOPIC) return;
  const raw = payload.toString();
  queue = queue.then(async () => {
    const msg = await verifyMessage(raw);
    if (!msg || seen.has(msg.s)) return;
    if (!packet.retain && Math.abs(Date.now() - msg.t) > 10 * 60 * 1000) return;
    seen.add(msg.s);
    showMessage(msg);
  });
}

function connect() {
  client = mqtt.connect(BROKER, {
    clientId: "mqttchat_" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 15000,
  });
  client.on("connect", () => {
    connected = true;
    $("status").textContent = "connected"; $("status").className = "on";
    if (!welcomed) {
      welcomed = true;
      note("connected to " + TOPIC + " - click your nickname to change it.");
    }
    client.subscribe(TOPIC);
    refreshSend();
  });
  const down = text => () => {
    connected = false;
    $("status").textContent = text; $("status").className = "";
    refreshSend();
  };
  client.on("reconnect", down("reconnecting…"));
  client.on("close", down("disconnected"));
  client.on("error", down("connection error"));
  client.on("message", onMessage);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !keys || !connected) return;
  const nick = nickname || "anonymous";
  $("text").value = "";
  refreshCount();
  const payload = await signMessage(keys, nick, text.slice(0, MAX_TEXT));
  client.publish(TOPIC, payload, { qos: 1, retain: true });
  $("text").focus();
});

function closeDialog(accept) {
  if (accept) {
    nickname = $("dinput").value.trim().slice(0, MAX_NICK);
    store.set("mqttchat.nick", nickname);
    refreshNick();
  }
  $("overlay").hidden = true;
  $("text").focus();
}
$("nickbtn").addEventListener("click", () => {
  $("dinput").value = nickname;
  $("overlay").hidden = false;
  $("dinput").focus();
  $("dinput").select();
});

const COUNT_FROM = 400;
function refreshCount() {
  const n = $("text").value.length;
  const el = $("count");
  el.hidden = n < COUNT_FROM;
  el.textContent = n + "/" + MAX_TEXT;
  el.className = n >= MAX_TEXT ? "full" : n >= MAX_TEXT - 20 ? "near" : "";
}
$("text").addEventListener("input", refreshCount);
$("dialog").addEventListener("submit", e => { e.preventDefault(); closeDialog(true); });
$("dcancel").addEventListener("click", () => closeDialog(false));
$("dclose").addEventListener("click", () => closeDialog(false));
$("lightbox").addEventListener("click", e => { if (e.target.id !== "lbopen") closeLightbox(); });
$("lbclose").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
$("overlay").addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(false); });

(async function init() {
  nickname = (store.get("mqttchat.nick") || "").trim().slice(0, MAX_NICK);
  setShowMedia(store.get("mqttchat.showMedia") !== "0");
  $("mediatoggle").addEventListener("change", e => setShowMedia(e.target.checked));
  refreshNick();
  note("join our Discord server and hang out with us: " + DISCORD, "invite");
  try {
    await loadIdentity();
  } catch (e) {
    note("this browser does not support Ed25519 in Web Crypto, so messages cannot be signed. Try a current version of Chrome, Firefox, Edge or Safari.", "err");
    return;
  }
  if (typeof mqtt === "undefined") {
    note("could not load the MQTT library from unpkg.com.", "err");
    return;
  }
  connect();
})();
</script>
</body>
